# LintGate configuration — generated by scaffold_config
# Review and adjust to match your project's needs.

pipeline_critical_paths:
  - "src/prism/sources.py"

# Targeted exemptions — each must name a specific file + code with rationale.
# Do NOT use this to downgrade severity globally (see CLAUDE.md debt policy).
exemptions:
  STRUCT003:
    files:
      - "src/prism/compaction_analysis.py"  # imported in server.py L14 (grouped)
      - "src/prism/compaction_trigger.py"   # imported in hooks.py L17 (grouped)
      - "src/prism/phase_matcher.py"        # imported in hooks.py L17 (grouped)
    rationale: >
      False positive — the scanner does not detect intra-package multi-line
      grouped imports (e.g., `from . import (a, b, c)`). Verified via grep
      that all three modules are imported and actively used. Ticket: none
      (LintGate scanner limitation, not project debt).

controlplane:
  enabled: true
  severity_weighted_coherence: true
  channels:
    behavior:
      enabled: true
      thresholds:
        approach_cycling_count: 3
        failure_amnesia_lookback: 30
  inquiry:
    theory_grounded_signals: true
    prediction_tracking: true
    theory_coherence_check: true
    living_context: true
    session_gate: true

